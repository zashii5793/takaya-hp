# GitHub に上げたら、さくらのレンタルサーバーへ自動で反映する。
#
# 動く条件（最初に1回だけ必要な設定）
#   GitHub の Settings → Secrets and variables → Actions → New repository secret
#   で次の3つを登録する。値は画面に出ず、ログにも残らない。
#
#     FTP_SERVER     limegopher49.sakura.ne.jp
#     FTP_USERNAME   limegopher49
#     FTP_PASSWORD   サーバーパスワード
#
#   ※ パスワードはリポジトリに書かないこと。必ず Secrets に入れる。
#
# 何をするか
#   1. Googleブログの記事を取り込む（取り込めなければ前回ぶんのまま）
#   2. 口コミを取り込む（同上）
#   3. サイトを作り直す
#   4. site/ の中身を ~/www へ転送する（変わったファイルだけ送る）
#
# いつ動くか
#   - main に push したとき（site/ tools/ assets/ のどれかが変わったとき）
#   - 毎日 朝6時（日本時間）… 新しいブログ記事を取り込んで反映するため
#   - 画面の「Run workflow」を押したとき

name: さくらへ公開

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 21 * * *'      # UTC 21:00 = 日本時間 翌朝6:00
  workflow_dispatch:

concurrency:
  group: deploy-sakura        # 同時に2つ動かさない（転送がぶつかるため）
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Googleブログの記事を取り込む
        continue-on-error: true      # 取り込めなくても公開は止めない
        run: python3 tools/fetch_blog.py

      - name: 口コミを取り込む
        continue-on-error: true
        run: python3 tools/fetch_reviews.py

      - name: サイトを作る
        run: python3 tools/build_site.py

      - name: 中身を確かめる
        run: |
          test -f site/index.html || { echo "index.html がありません"; exit 1; }
          test -f site/assets/css/site.css || { echo "site.css がありません"; exit 1; }
          echo "ファイル数: $(find site -type f | wc -l)"

      - name: 転送の道具を入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: さくらへ転送
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # パスワードは LFTP_PASSWORD から読ませる。コマンド行に書くとログに残るため
          send() {
            lftp -c "
              set ftp:ssl-allow $1;
              set ftp:ssl-force $1;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              set ftp:passive-mode true;
              set net:max-retries 2;
              set net:timeout 20;
              open -u \"$FTP_USERNAME\" --env-password \"$FTP_SERVER\";
              mirror --reverse --delete --verbose --parallel=2 ./site/ www/
            "
          }

          # まず暗号化（FTPS）で試し、だめなら平文のFTPで送る。
          # さくらは FTPS が通らないことがあるため
          if send true; then
            echo "FTPS（暗号化）で転送しました"
          else
            echo "FTPS が通らなかったので、FTP で送り直します"
            send false
            echo "FTP（平文）で転送しました。FTPサブアカウントの利用を検討してください"
          fi
