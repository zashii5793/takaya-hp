# 確認用のプレビューサイトを GitHub Pages で公開する。
# 公開先: https://zashii5793.github.io/takaya-hp/
#
# site/ は tools/build_site.py が生成したものをリポジトリに入れてあるので、
# ここではビルドしない。リンク・画像はすべて相対指定なので、
# /takaya-hp/ のようにサブディレクトリに置いても崩れない。
#
# これは本番 www.takayagroup.co.jp と同じ内容になる。
# 検索結果に二重に出ないよう、配信するコピーだけ検索拒否にする（下の手順）。
# リポジトリの site/ は本番用のまま一切書き換えない。
#
# 【最初に1回だけ必要な設定】
# Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」にする。
# https://github.com/zashii5793/takaya-hp/settings/pages
#
# ここを設定しないと configure-pages が Not Found で止まる。
# ワークフローのトークンでは Pages の有効化ができない
# （Create Pages site → Resource not accessible by integration）ため、
# この1回だけは画面での操作が必要。
name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/youthful-planck-72dm1v
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。走っている途中のものは止めない
# （途中で切ると中途半端な状態が公開されてしまう）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 配信用コピーを作り、検索エンジンに載らないようにする
        run: |
          set -eu
          cp -r site _pages

          # 1. クロールを断る
          printf 'User-agent: *\nDisallow: /\n' > _pages/robots.txt

          # 2. sitemap.xml は本番のURLを並べたものなので、確認用には置かない
          rm -f _pages/sitemap.xml

          # 3. リンクをたどって来た場合にも載らないよう、全ページを noindex にする
          find _pages -name '*.html' -print0 | xargs -0 sed -i \
            's|<meta name="robots" content="[^"]*">|<meta name="robots" content="noindex,nofollow">|'

          # 意図どおりになったか、ログに残す
          echo '--- robots.txt ---'
          cat _pages/robots.txt
          total=$(find _pages -name '*.html' | wc -l)
          noindex=$(grep -rl 'content="noindex,nofollow"' _pages --include='*.html' | wc -l)
          echo "--- noindex: ${noindex} / ${total} ページ ---"
          # 1ページでも漏れていたら公開しない
          test "$noindex" -eq "$total"

      # Pages がまだ有効でないだけの状態で、このチェックを赤くしない。
      # 赤いとサイトのビルドが壊れているように見えてしまうが、実際は
      # リポジトリ設定が1つ足りないだけで、コードには問題がない。
      - name: Pages が有効かどうか調べる
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Pages は有効。公開に進む。'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            {
              echo '### GitHub Pages がまだ有効になっていません'
              echo
              echo 'この公開は飛ばしました。サイトの中身に問題はありません。'
              echo
              echo '1回だけ、次の設定が必要です。'
              echo
              echo 'Settings → Pages → Build and deployment → **Source** を **GitHub Actions** に'
              echo
              echo '<https://github.com/${{ github.repository }}/settings/pages>'
              echo
              echo '設定したあと、このワークフローを「Run workflow」で実行すると公開されます。'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'Pages が未設定のため、公開は飛ばす（失敗にはしない）。'
          fi

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - if: steps.check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
